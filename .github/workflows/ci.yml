name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rules engine, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Browser checks (interface and pacing)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the production build
        run: |
          npm run preview -- --port 5178 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5178 > /dev/null && break
            sleep 1
          done
      - run: npm run test:ui
      - run: npm run test:pacing
      - run: npm run test:hotseat
      - run: npm run test:revisions
      - run: npm run test:precons
      - run: npm run test:ring-maker-players
      - run: npm run test:against-shadow-finale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output
          retention-days: 7
