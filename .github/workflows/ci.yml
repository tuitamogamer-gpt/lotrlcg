name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rules engine, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:engine
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  simulation:
    name: Complete games (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SIMULATION_SHARDS: 4
      SIMULATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:simulation

  grey-havens-simulation:
    name: Grey Havens review parity (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [voyage-across-belegaer, the-fate-of-numenor, raid-on-the-grey-havens]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          node --import tsx --test
          --test-name-pattern="^Grey Havens ${{ matrix.scenario }} "
          tests/grey-havens-simulation.test.ts

  stormcaller-simulation:
    name: Stormcaller review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
