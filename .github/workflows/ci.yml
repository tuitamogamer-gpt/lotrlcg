name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rules engine, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:engine
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  simulation:
    name: Complete games (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SIMULATION_SHARDS: 4
      SIMULATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:simulation

  grey-havens-simulation:
    name: Grey Havens review parity (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [voyage-across-belegaer, the-fate-of-numenor, raid-on-the-grey-havens]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          node --import tsx --test
          --test-name-pattern="^Grey Havens ${{ matrix.scenario }} "
          tests/grey-havens-simulation.test.ts

  stormcaller-simulation:
    name: Stormcaller review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:stormcaller-simulation

  depths-simulation:
    name: Depths review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:depths-simulation

  temple-simulation:
    name: Temple review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:temple-simulation

  drowned-simulation:
    name: Drowned Ruins review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:drowned-simulation

  cobas-simulation:
    name: Cobas Haven review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cobas-simulation

  city-simulation:
    name: City of Corsairs review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:city-simulation

  harad-simulation:
    name: Harad review parity (${{ matrix.scenario }}, 32 complete games)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [escape-from-umbar, desert-crossing, the-long-arm-of-mordor]
    env:
      HARAD_SIMULATION_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:harad-simulation

  mumakil-simulation:
    name: Mûmakil review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mumakil-simulation

  race-harad-simulation:
    name: Race Across Harad review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:race-harad-simulation

  beneath-sands-simulation:
    name: Beneath the Sands review parity (32 complete games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:beneath-sands-simulation

  batch4-simulation:
    name: Batch 4 review parity (${{ matrix.scenario }}, 32 complete games)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            the-black-serpent,
            the-dungeons-of-cirith-gurat,
            the-crossings-of-poros,
            journey-up-the-anduin,
            lost-in-mirkwood,
            the-kings-quest,
          ]
    env:
      BATCH4_SIMULATION_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:batch4-simulation

  ered-simulation:
    name: Ered Mithrin complete games (${{ matrix.scenario }}, 14 games)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            the-withered-heath,
            roam-across-rhovanion,
            fire-in-the-night,
            the-ghost-of-framsburg,
            mount-gundabad,
            the-fate-of-wilderland,
          ]
    env:
      ERED_SIMULATION_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ered-simulation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ered-simulation-${{ matrix.scenario }}
          path: output/ered-release/failures
          retention-days: 7

  shadow-east-simulation:
    name: Shadow in the East complete games (${{ matrix.scenario }}, 14 games)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [the-river-running, danger-in-dorwinion, temple-of-doom]
    env:
      SHADOW_EAST_SIMULATION_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:shadow-east-simulation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shadow-east-simulation-${{ matrix.scenario }}
          path: output/shadow-east-release/failures
          retention-days: 7

  wrath-ruin-simulation:
    name: Wrath and Ruin complete games (14 games)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:wrath-ruin-simulation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wrath-ruin-simulation
          path: output/wrath-ruin-release/failures
          retention-days: 7

  multiplayer:
    name: Multiplayer games (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            mirkwood,
            anduin,
            dol-guldur,
            the-weather-hills,
            deadmens-dike,
            wastes-of-eriador,
            escape-from-mount-gram,
            across-the-ettenmoors,
            the-treachery-of-rhudaur,
            the-battle-of-carn-dum,
            the-dread-realm,
            voyage-across-belegaer,
            the-fate-of-numenor,
            raid-on-the-grey-havens,
            flight-of-the-stormcaller,
            the-thing-in-the-depths,
            temple-of-the-deceived,
            the-drowned-ruins,
            a-storm-on-cobas-haven,
            the-city-of-corsairs,
            escape-from-umbar,
            desert-crossing,
            the-long-arm-of-mordor,
            the-mumakil,
            race-across-harad,
            beneath-the-sands,
            the-black-serpent,
            the-dungeons-of-cirith-gurat,
            the-crossings-of-poros,
            journey-up-the-anduin,
            lost-in-mirkwood,
            the-kings-quest,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          node --import tsx --test
          --test-name-pattern="^hot-seat ${{ matrix.scenario }} (normal|campaign): complete seeded games with save checks$"
          tests/hotseat.test.ts

  browser:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            suite: test:browser-core
          - group: players
            suite: test:browser-players
          - group: ring-maker
            suite: test:browser-ring-maker
          - group: angmar-awakened
            suite: test:browser-angmar
          - group: grey-havens
            suite: test:browser-grey-havens
          - group: stormcaller
            suite: test:browser-stormcaller
          - group: depths
            suite: test:browser-depths
          - group: temple
            suite: test:browser-temple
          - group: drowned
            suite: test:browser-drowned
          - group: cobas
            suite: test:browser-cobas
          - group: city
            suite: test:browser-city
          - group: harad
            suite: test:browser-harad
          - group: mumakil
            suite: test:browser-mumakil
          - group: race-harad
            suite: test:browser-race-harad
          - group: beneath-sands
            suite: test:browser-beneath-sands
          - group: black-serpent
            suite: test:browser-black-serpent
          - group: cirith-gurat
            suite: test:browser-cirith-gurat
          - group: crossings-poros
            suite: test:browser-crossings-poros
          - group: wilds-rhovanion
            suite: test:browser-wilds-rhovanion
          - group: batch4-players
            suite: test:browser-batch4-players
          - group: withered-heath
            suite: test:browser-withered-heath
          - group: roam-rhovanion
            suite: test:browser-roam-rhovanion
          - group: fire-night
            suite: test:browser-fire-night
          - group: ghost-framsburg
            suite: test:browser-ghost-framsburg
          - group: significant-audio
            suite: test:significant-audio
          - group: ered-finale
            suite: test:browser-ered-finale
          - group: ered-players
            suite: test:browser-ered-players
          - group: shadow-east-quests
            suite: test:shadow-east-quests
          - group: shadow-east-players
            suite: test:shadow-east-players
          - group: wrath-ruin-quests
            suite: test:wrath-ruin-quests
          - group: wrath-ruin-players
            suite: test:wrath-ruin-players
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Serve the production build
        run: node scripts/test-preview.mjs --port 5178
      - run: npm run ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.group }}
          path: output
          retention-days: 7
